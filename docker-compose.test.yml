name: taskmanager_test

services:
  db_test:
    image: postgres:15
    container_name: taskmanager_test_db
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: taskmanager_test
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d taskmanager_test"]
      interval: 2s
      timeout: 5s
      retries: 15
